# Optional cargo-make aliases. The canonical gate is scripts/ci-local.sh.

[config]
default_to_workspace = false
skip_core_tasks = false

[tasks.check]
description = "Run the deterministic containerless default gate"
command = "./scripts/ci-local.sh"

[tasks.ci]
alias = "check"

[tasks.build]
description = "Build the workspace"
command = "cargo"
args = ["build", "--locked", "--workspace"]

[tasks.test]
description = "Run workspace deterministic and documentation tests"
dependencies = ["test-deterministic", "test-doc"]

[tasks.test-deterministic]
description = "Run containerless unit, integration, and binary tests"
command = "cargo"
args = ["test", "--locked", "--workspace", "--lib", "--bins", "--tests"]

[tasks.test-doc]
description = "Run documentation tests"
command = "cargo"
args = ["test", "--locked", "--doc", "--workspace"]

[tasks.test-v011-upgrade]
description = "Generate and verify exact v0.1.1 upgrade fixtures and downgrade reopen"
command = "python3"
args = ["scripts/test-v011-upgrade-fixtures.py"]

[tasks.test-simulation]
description = "Run the frozen 10,000-case seeded lifecycle simulation in eight host shards"
script = '''
set -eu
log_directory=$(mktemp -d "${TMPDIR:-/tmp}/kapsel-simulation-logs.XXXXXX")
trap 'rm -rf "$log_directory"' EXIT HUP INT TERM
cargo test --release --locked -p kapsel --lib --no-run
pids=""
for shard in 0 1 2 3 4 5 6 7; do
  KAPSEL_SIMULATION_SHARDS=8 KAPSEL_SIMULATION_SHARD_INDEX=$shard \
    cargo test --release --locked -p kapsel --lib \
      simulation_tests::seeded_lifecycle_crash_simulation_preserves_invariants -- \
      --ignored --exact --nocapture >"$log_directory/$shard.log" 2>&1 &
  pids="$pids $!"
done
status=0
for pid in $pids; do
  if ! wait "$pid"; then
    status=1
  fi
done
for shard in 0 1 2 3 4 5 6 7; do
  cat "$log_directory/$shard.log"
done
exit "$status"
'''

[tasks.test-kind]
description = "Run the explicit live Kubernetes gate through a disposable kind cluster"
command = "./scripts/test-kind-effect-gateway.sh"

[tasks.demo-kind]
description = "Run the public real-process crash-recovery demonstration"
command = "./scripts/demo-kind-crash-recovery.sh"

[tasks.test-demo-harness-prerequisites]
description = "Test fail-closed demo prerequisite handling"
command = "python3"
args = ["scripts/test-demo-kind-crash-recovery.py"]

[tasks.test-demo-harness]
description = "Run deterministic real-process demo seam tests"
dependencies = ["test-demo-harness-prerequisites"]
command = "cargo"
args = [
  "test",
  "--locked",
  "-p",
  "kapsel",
  "--features",
  "demo-harness",
  "--test",
  "e2e_demo_recovery",
]

[tasks.assemble-release]
description = "Assemble the clean x86-64 GNU/Linux archive and deterministic sidecars"
command = "python3"
args = ["scripts/assemble-release-artifact.py", "--output-directory", "dist"]

[tasks.assemble-kapsel-service]
description = "Assemble the unpublished Kapsel service artifact"
command = "python3"
args = ["scripts/assemble-kapsel-service-artifact.py", "--output-directory", "dist"]

[tasks.test-kapsel-service-artifact]
description = "Verify and smoke one strict Kapsel service artifact"
script = '''
set -eu
: "${KAPSEL_SERVICE_ARCHIVE:?set KAPSEL_SERVICE_ARCHIVE to strict artifact A}"
python3 scripts/test-kapsel-service-artifact.py --archive "$KAPSEL_SERVICE_ARCHIVE"
'''

[tasks.test-kapsel-service-reproducibility]
description = "Assemble Kapsel service artifact B and compare it byte-for-byte with strict A"
script = '''
set -eu
: "${KAPSEL_SERVICE_ARCHIVE:?set KAPSEL_SERVICE_ARCHIVE to strict artifact A}"
python3 scripts/test-kapsel-service-reproducibility.py \
  --reference-archive "$KAPSEL_SERVICE_ARCHIVE"
'''

[tasks.test-release-sbom-scan]
description = "Test release SBOM scanner freshness, findings, and atomic database identity"
command = "python3"
args = ["scripts/test-scan-release-sbom.py"]

[tasks.test-release-artifact]
description = "Verify and smoke-test one already assembled release artifact"
dependencies = ["test-release-sbom-scan"]
script = '''
set -eu
: "${KAPSEL_RELEASE_ARCHIVE:?set KAPSEL_RELEASE_ARCHIVE to strict artifact A}"
python3 scripts/test-release-artifact.py --archive "$KAPSEL_RELEASE_ARCHIVE"
'''

[tasks.test-release-reproducibility]
description = "Assemble B and compare it byte-for-byte with strict artifact A"
script = '''
set -eu
: "${KAPSEL_RELEASE_ARCHIVE:?set KAPSEL_RELEASE_ARCHIVE to strict artifact A}"
python3 scripts/test-release-reproducibility.py --reference-archive "$KAPSEL_RELEASE_ARCHIVE"
'''

[tasks.scan-release-sbom]
description = "Scan one exact release SBOM with the frozen fresh Trivy policy"
script = '''
set -eu
: "${KAPSEL_RELEASE_SBOM:?set KAPSEL_RELEASE_SBOM to the exact SPDX JSON sidecar}"
: "${KAPSEL_RELEASE_SBOM_SCAN:?set KAPSEL_RELEASE_SBOM_SCAN to the summary output path}"
python3 scripts/scan-release-sbom.py \
  --sbom "$KAPSEL_RELEASE_SBOM" \
  --output "$KAPSEL_RELEASE_SBOM_SCAN"
'''

[tasks.test-release-upgrade-backup]
description = "Test artifact-upgrade backup verification and non-destructive restore refusal"
command = "python3"
args = ["scripts/test-release-upgrade.py"]

[tasks.test-release-upgrade]
description = "Exercise an extracted candidate across exact v0.1.1 upgrade and rollback"
dependencies = ["test-release-upgrade-backup"]
script = '''
set -eu
: "${KAPSEL_RELEASE_ARCHIVE:?set KAPSEL_RELEASE_ARCHIVE to the candidate archive path}"
: "${KAPSEL_V011_ARCHIVE:?set KAPSEL_V011_ARCHIVE to the exact v0.1.1 archive path}"
python3 scripts/smoke-release-upgrade.py \
  --candidate-archive "$KAPSEL_RELEASE_ARCHIVE" \
  --v011-archive "$KAPSEL_V011_ARCHIVE"
'''

[tasks.demo-release-artifact]
description = "Run the live kind demo from an extracted release artifact"
script = '''
set -eu
: "${KAPSEL_RELEASE_ARCHIVE:?set KAPSEL_RELEASE_ARCHIVE to the release archive path}"
python3 scripts/smoke-release-artifact.py --archive "$KAPSEL_RELEASE_ARCHIVE" --live-demo
'''

[tasks.fuzz-check]
description = "Compile the offline receipt-inspection fuzz target"
cwd = "fuzz"
command = "rustup"
args = ["run", "nightly-2026-07-03", "cargo", "fuzz", "check", "inspect_receipt"]

[tasks.test-fuzz]
description = "Run the frozen 10,000-case seeded receipt-inspection fuzz lane"
cwd = "fuzz"
script = '''
set -eu
corpus_directory=$(mktemp -d "${TMPDIR:-/tmp}/kapsel-fuzz-corpus.XXXXXX")
trap 'rm -rf "$corpus_directory"' EXIT HUP INT TERM
cp corpus/inspect_receipt/canonical-receipt-and-trust "$corpus_directory/"
rustup run nightly-2026-07-03 cargo fuzz run --dev inspect_receipt "$corpus_directory" -- \
  -runs=10000 -seed=2118243591
'''

[tasks.test-beta-qualification-privacy]
description = "Run the closed beta qualification privacy and overclaim review"
command = "python3"
args = ["scripts/test-check-beta-qualification-privacy.py"]

[tasks.test-beta-qualification-security]
description = "Run fresh beta qualification dependency and exact-tree secret scans"
command = "python3"
args = ["scripts/run-beta-qualification-security.py", "--output", "/tmp/beta-qualification-security.json"]

[tasks.test-beta-qualification-orchestrator]
description = "Test the beta qualification orchestrator"
command = "python3"
args = ["scripts/test-run-beta-qualification.py"]

[tasks.qualify-beta]
description = "Run every beta qualification lane for one clean candidate"
dependencies = ["test-beta-qualification-orchestrator", "test-beta-qualification-privacy"]
command = "python3"
args = [
  "scripts/run-beta-qualification.py",
  "--output",
  "/tmp/beta-qualification-baseline.json",
]

[tasks.fmt]
clear = true
description = "Format Rust and Markdown sources"
dependencies = ["fmt-rust", "fmt-markdown"]

[tasks.fmt-rust]
description = "Format workspace and fuzz-target Rust sources"
script = '''
set -eu
cargo fmt --all
if [ -f fuzz/Cargo.toml ]; then
  cargo fmt --manifest-path fuzz/Cargo.toml
fi
'''

[tasks.fmt-markdown]
description = "Format Markdown sources and expand tables"
command = "prettier"
args = ["--write", "--no-config", "--ignore-path", ".gitignore", "--print-width", "100", "--prose-wrap", "always", "--tab-width", "2", "**/*.md"]

[tasks.fmt-check]
clear = true
description = "Check Rust and Markdown formatting"
dependencies = ["fmt-check-rust", "fmt-check-markdown"]

[tasks.fmt-check-rust]
description = "Check Rust formatting and line width"
dependencies = ["fmt-check-rustfmt", "fmt-check-rust-width"]

[tasks.fmt-check-rustfmt]
description = "Check workspace and fuzz-target Rust formatting"
script = '''
set -eu
cargo fmt --all --check
if [ -f fuzz/Cargo.toml ]; then
  cargo fmt --manifest-path fuzz/Cargo.toml --check
fi
'''

[tasks.fmt-check-rust-width]
description = "Check the strict 100-byte Rust source width"
command = "./scripts/check-rust-width.sh"

[tasks.fmt-check-markdown]
description = "Check Markdown formatting"
command = "prettier"
args = ["--check", "--no-config", "--ignore-path", ".gitignore", "--print-width", "100", "--prose-wrap", "always", "--tab-width", "2", "**/*.md"]

[tasks.tidy]
description = "Run hard project-local hygiene checks"
command = "cargo"
args = ["run", "--quiet", "--locked", "-p", "kapsel-dev", "--bin", "kapsel-tidy", "--", "tidy"]

[tasks.style-audit]
description = "Report non-blocking project-local style prompts"
command = "cargo"
args = ["run", "--quiet", "--locked", "-p", "kapsel-dev", "--bin", "kapsel-tidy", "--", "style-audit"]

[tasks.hooks-install]
description = "Install the repository pre-commit hook"
command = "cargo"
args = ["run", "--quiet", "--locked", "-p", "kapsel-dev", "--bin", "kapsel-hooks", "--", "install"]

[tasks.hooks-uninstall]
description = "Uninstall the repository pre-commit hook"
command = "cargo"
args = ["run", "--quiet", "--locked", "-p", "kapsel-dev", "--bin", "kapsel-hooks", "--", "uninstall"]

[tasks.lint]
description = "Run Clippy across production and test targets"
command = "cargo"
args = ["clippy", "--locked", "--workspace", "--all-targets", "--all-features", "--", "-D", "warnings"]

[tasks.clean]
description = "Remove build artifacts"
command = "cargo"
args = ["clean"]

[tasks.docs]
description = "Build warning-free workspace documentation"
env = { "RUSTDOCFLAGS" = "-D warnings" }
command = "cargo"
args = ["doc", "--locked", "--workspace", "--no-deps"]

[tasks.docs-links-test]
description = "Test the Markdown path and heading-anchor checker"
command = "./scripts/test-check-markdown-links.py"

[tasks.docs-links]
description = "Check tracked Markdown paths and heading anchors"
dependencies = ["docs-links-test"]
command = "./scripts/check-markdown-links.py"

[tasks.default]
alias = "check"
