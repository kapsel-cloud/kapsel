[package]
name = "kapseld"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
test-harness = ["kapsel/demo-harness"]

[dependencies]
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["signature", "zeroize"] }
kapsel = { path = "../.." }
kube = { version = "=4.0.0", default-features = false, features = ["client", "ring", "rustls-tls"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
tokio = { version = "=1.52.3", features = ["io-util", "net", "rt", "sync", "time"] }

[dev-dependencies]
http = "=1.4.2"
sha2 = "=0.11.0"
tower-test = "=0.4.0"

[lints]
workspace = true
