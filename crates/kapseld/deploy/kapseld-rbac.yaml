apiVersion: v1
kind: ServiceAccount
metadata:
  name: kapsel-preview
  namespace: demo
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kapsel-preview-agent-api
  namespace: demo
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["agent-api"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kapsel-preview-agent-api
  namespace: demo
subjects:
  - kind: ServiceAccount
    name: kapsel-preview
    namespace: demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kapsel-preview-agent-api
