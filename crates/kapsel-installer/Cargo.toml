[package]
name = "kapsel-installer"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
build = "build.rs"

[dependencies]
base64 = "=0.22.1"
http = "=1.4.2"
kapsel = { path = "../.." }
rustix = { version = "=1.1.4", default-features = false, features = ["fs", "process", "rand", "std"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
serde-saphyr = { version = "=0.0.27", default-features = false, features = ["deserialize"] }
sha2 = "=0.11.0"

[build-dependencies]
rustix = { version = "=1.1.4", default-features = false, features = ["fs", "std"] }
serde_json = "=1.0.150"
sha2 = "=0.11.0"

[lints]
workspace = true
