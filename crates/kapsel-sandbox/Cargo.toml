[package]
name = "kapsel-sandbox"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Deterministic service package for the fixed Kapsel public sandbox"
publish = false

[dependencies]
ed25519-dalek = { version = "=3.0.0", default-features = false }
getrandom = "=0.3.4"
http = "=1.4.2"
http-body-util = "=0.1.3"
httparse = "=1.10.1"
kapsel = { path = "../.." }
kube = { version = "=4.0.0", default-features = false, features = ["client", "ring", "rustls-tls"] }
rusqlite = { version = "=0.40.1", features = ["bundled"] }
rustix = { version = "=1.1.4", default-features = false, features = ["fs", "net", "process", "std", "stdio", "thread"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.11.0"
tokio = { version = "=1.52.3", features = ["net", "rt", "time"] }
tower-http = { version = "=0.6.11", default-features = false, features = ["map-response-body"] }

[dev-dependencies]
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["signature"] }
rustls = { version = "=0.23.41", default-features = false, features = ["ring", "std"] }
tokio = { version = "=1.52.3", features = ["macros"] }
tower-test = "=0.4.0"

[lints]
workspace = true
