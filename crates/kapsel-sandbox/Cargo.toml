[package]
name = "kapsel-sandbox"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Deterministic service package for the fixed Kapsel public sandbox"
publish = false

[dependencies]
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["signature", "zeroize"] }
getrandom = "=0.3.4"
http = "=1.4.2"
httparse = "=1.10.1"
kapsel = { path = "../.." }
k8s-openapi = { version = "=0.28.0", features = ["v1_33"] }
kube = { version = "=4.0.0", default-features = false, features = ["client", "ring", "rustls-tls"] }
rusqlite = { version = "=0.40.1", features = ["bundled"] }
rustix = { version = "=1.1.4", default-features = false, features = ["fs", "process", "std"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.11.0"
rustls = { version = "=0.23.41", default-features = false, features = ["ring", "std"] }
tokio = { version = "=1.52.3", features = ["net", "rt", "sync", "time"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring"] }
x509-parser = { version = "=0.18.1", default-features = false }
zeroize = "=1.9.0"

[dev-dependencies]
tokio = { version = "=1.52.3", features = ["macros"] }
tower-test = "=0.4.0"

[lints]
workspace = true
