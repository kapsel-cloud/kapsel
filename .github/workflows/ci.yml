name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    name: Default gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.1"
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Markdown formatter
        run: npm install --global prettier@3.6.2
      - uses: Swatinem/rust-cache@v2
      - name: Run deterministic containerless gate
        run: ./scripts/ci-local.sh

  coverage:
    name: Rust coverage (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    env:
      CARGO_LLVM_COV_TARGET_DIR: target/llvm-cov-target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.1"
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          tool: cargo-llvm-cov@0.8.7
          fallback: none
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage
          workspaces: ". -> target/llvm-cov-target"
      - name: Generate deterministic Rust coverage
        id: coverage
        shell: bash
        run: |
          rm -f codecov.json
          if timeout --signal=TERM --kill-after=30s 10m \
            cargo llvm-cov --locked --workspace --codecov --output-path codecov.json \
            && test -s codecov.json
          then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            status=$?
            rm -f codecov.json
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Coverage unavailable::Coverage generation failed or exceeded its 10-minute bound (status $status); correctness remains owned by the default gate."
          fi
      - name: Upload informational coverage
        if: steps.coverage.outputs.available == 'true'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          files: codecov.json
          disable_search: true
          fail_ci_if_error: false
          flags: rust-deterministic
          name: rust-deterministic

  release-artifact:
    name: x86-64 GNU/Linux release artifact
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Smoke-test extracted artifact
        run: python3 scripts/test-release-artifact.py
      - name: Verify reproducible assembly
        run: python3 scripts/test-release-reproducibility.py
      - name: Assemble downloadable artifact
        if: github.event_name == 'push'
        run: python3 scripts/assemble-release-artifact.py --output-directory dist
      - name: Upload deterministic archive and sidecars
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: kapsel-x86_64-unknown-linux-gnu-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.tar.gz.spdx.json
            dist/*.tar.gz.SHA256SUMS
          if-no-files-found: error
          compression-level: 0
