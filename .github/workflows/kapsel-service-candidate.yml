name: Kapsel service candidate

on:
  workflow_dispatch:

permissions: {}

jobs:
  candidate:
    name: Authenticate Kapsel service candidate
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Verify exact source
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Assemble strict candidate A
        id: artifact
        run: |
          archive=$(python3 scripts/assemble-kapsel-service-artifact.py \
            --output-directory "$RUNNER_TEMP/kapsel-service-a")
          echo "archive=$archive" >>"$GITHUB_OUTPUT"
      - name: Verify candidate A from extracted files
        run: python3 scripts/test-kapsel-service-artifact.py --archive "${{ steps.artifact.outputs.archive }}"
      - name: Assemble B and compare exact bytes
        run: python3 scripts/test-kapsel-service-reproducibility.py --reference-archive "${{ steps.artifact.outputs.archive }}"
      - name: Stage exact deterministic bytes
        env:
          ARCHIVE: ${{ steps.artifact.outputs.archive }}
        run: |
          set -eu
          mkdir dist
          for suffix in '' .sha256 .SHA256SUMS; do
            cp -- "$ARCHIVE$suffix" "dist/$(basename "$ARCHIVE$suffix")"
            cmp -- "$ARCHIVE$suffix" "dist/$(basename "$ARCHIVE$suffix")"
          done
      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2
      - name: Authenticate exact digest manifest
        env:
          CERTIFICATE_IDENTITY: https://github.com/kapsel-cloud/kapsel/.github/workflows/kapsel-service-candidate.yml@refs/heads/master
        run: |
          set -eu
          manifest=$(find dist -maxdepth 1 -type f -name '*.tar.gz.SHA256SUMS')
          test "$(find dist -maxdepth 1 -type f -name '*.tar.gz.SHA256SUMS' | wc -l)" -eq 1
          bundle="$manifest.sigstore.json"
          cosign sign-blob --yes --bundle "$bundle" "$manifest"
          test "$(stat -c %s -- "$bundle")" -le 1048576
          cosign verify-blob \
            --bundle "$bundle" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-github-workflow-repository kapsel-cloud/kapsel \
            --certificate-github-workflow-ref refs/heads/master \
            --certificate-github-workflow-sha "$GITHUB_SHA" \
            --certificate-github-workflow-trigger workflow_dispatch \
            "$manifest"
          (cd dist && sha256sum --check --strict "$(basename "$manifest")")
      - name: Upload unpublished candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kapsel-service-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.tar.gz.SHA256SUMS
            dist/*.tar.gz.SHA256SUMS.sigstore.json
          if-no-files-found: error
          compression-level: 0

  downloaded-candidate:
    name: Verify downloaded Kapsel service artifact
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kapsel-service-${{ github.sha }}
          path: downloaded
      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2
      - name: Authenticate and smoke downloaded bytes
        env:
          CERTIFICATE_IDENTITY: https://github.com/kapsel-cloud/kapsel/.github/workflows/kapsel-service-candidate.yml@refs/heads/master
        run: |
          set -eu
          archive=$(find downloaded -maxdepth 1 -type f -name '*.tar.gz')
          test "$(find downloaded -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 1
          manifest="$archive.SHA256SUMS"
          cosign verify-blob \
            --bundle "$manifest.sigstore.json" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-github-workflow-repository kapsel-cloud/kapsel \
            --certificate-github-workflow-ref refs/heads/master \
            --certificate-github-workflow-sha "$GITHUB_SHA" \
            --certificate-github-workflow-trigger workflow_dispatch \
            "$manifest"
          (cd downloaded && sha256sum --check --strict "$(basename "$manifest")")
          archive_name=$(basename "$archive")
          top_level=${archive_name%.tar.gz}
          verifier=$(mktemp)
          tar --extract --to-stdout --file "$archive" \
            "$top_level/share/kapsel/verify-kapsel-service-artifact.py" >"$verifier"
          parent=$(mktemp -d)
          extracted=$(python3 "$verifier" \
            --archive "$archive" \
            --expected-revision "$GITHUB_SHA" \
            --extract-directory "$parent/extracted")
          "$extracted/bin/kapsel" --version
          set +e
          "$extracted/libexec/kapsel/kapseld"
          daemon_status=$?
          set -e
          test "$daemon_status" = 4
          version=$(python3 -c \
            'import json,sys; print(json.load(open(sys.argv[1]))["package_version"])' \
            "$extracted/SERVICE-METADATA.json")
          docker run --rm --platform linux/amd64 \
            --volume "$extracted:/artifact:ro" \
            python@sha256:86adf8dbadc3d6e82ee5dd2c74bec2e1c2467cdad47886280501df722372d2e1 \
            python3 /artifact/share/kapsel/smoke-kapsel-service-artifact.py \
              --extracted-root /artifact \
              --expected-kapsel-version "$version"
          rm -rf "$parent" "$verifier"
