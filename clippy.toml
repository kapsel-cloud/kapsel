# Clippy diagnostics support review; contracts and cohesion own design decisions.
# Thresholds do not require splitting complete decoders or ordered evidence traces.

# Review threshold for cognitive complexity
cognitive-complexity-threshold = 30

# Review threshold for function length
too-many-lines-threshold = 100

# Review threshold for argument count
too-many-arguments-threshold = 7

# Review threshold for type-expression complexity
type-complexity-threshold = 250

# Maximum number of single char bindings
single-char-binding-names-threshold = 4

# Enforce MSRV
msrv = "1.98"

# Disallowed names
disallowed-names = ["foo", "bar", "baz", "tmp", "temp", "test", "data"]

# Documentation requirements
doc-valid-idents = [
  "WebSocket",
  "OAuth",
  "OpenTelemetry",
  "gRPC",
  "UUID",
  "URL",
  "URI",
  "HTTP",
  "HTTPS",
  "TCP",
  "UDP",
  "TLS",
  "mTLS",
  "JWT",
  "HMAC",
  "SHA256",
  "API",
  "JSON",
  "YAML",
  "TOML",
  "SQL",
  "HTML",
  "CSS",
  "JavaScript",
  "TypeScript",
  "GitHub",
  "GitLab",
  "CPU",
  "GPU",
  "RAM",
  "I/O",
  "Kapsel",
]

# Maximum size of an enum variant
enum-variant-size-threshold = 200

# Avoid common OOP patterns that don't fit Rust
avoid-breaking-exported-api = false

# Controlled test assertions may fail immediately. Production denies remain in Cargo.toml.
allow-expect-in-tests = true
allow-unwrap-in-tests = true
allow-dbg-in-tests = true
allow-print-in-tests = true

# Byte bound for include_str!/include_bytes! payload diagnostics, not source line width.
max-include-file-size = 1000000

# Standard library functions that should be avoided
disallowed-methods = [
  { path = "std::env::set_var", reason = "Use a proper configuration system instead" },
  { path = "std::env::remove_var", reason = "Use a proper configuration system instead" },
  { path = "std::mem::forget", reason = "Use ManuallyDrop or proper ownership instead" },
  { path = "std::vec::Vec::leak", reason = "Leaking memory is almost never correct" },
  { path = "std::boxed::Box::leak", reason = "Leaking memory is almost never correct" },
]

# Cargo.toml denies print_stdout, print_stderr and dbg_macro directly.
# Intentional CLI and controlled-test output uses local exceptions.

# Third-party crate behavior
warn-on-all-wildcard-imports = true

# Array size threshold for stack vs heap
array-size-threshold = 512000
